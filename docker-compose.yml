services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/data   # база и загруженные работы — см. «Резервная копия» в README

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  app_data:
  caddy_data:
  caddy_config:
